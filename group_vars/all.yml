---
# ==========================================
# Variables Globales (DNS y DHCP)
# ==========================================
infra_domain: "polanco.lab"
infra_server_ip: "192.168.56.10"
infra_network: "192.168.56.0"
infra_netmask: "255.255.255.0"

# ==========================================
# Variables DNS (BIND)
# ==========================================
dns_forwarders:
  - "8.8.8.8"
  - "1.1.1.1"
dns_allowed_networks:
  - "127.0.0.0/8"
  - "192.168.56.0/24"
dns_reverse_zone: "56.168.192.in-addr.arpa"
dns_serial: "2026090901" 

dns_records_a:
  - { name: "ns1", ip: "192.168.56.10" }
  - { name: "router", ip: "192.168.56.1" }
  - { name: "cliente01", ip: "192.168.56.50" }

dns_records_ptr:
  - { last_octet: "10", name: "ns1" }
  - { last_octet: "1", name: "router" }
  - { last_octet: "50", name: "cliente01" }

# ==========================================
# Variables DHCP
# ==========================================
# enp0s8 suele ser la segunda interfaz en VirtualBox (Host-Only o Red Interna). 
dhcp_interface: "enp0s8"
dhcp_gateway: "192.168.56.1"
dhcp_range_start: "192.168.56.100"
dhcp_range_end: "192.168.56.200"
dhcp_default_lease: 86400
dhcp_max_lease: 172800

dhcp_reservations:
  - name: "pc_docente"
    mac: "08:00:27:11:22:33" # MAC de ejemplo de VirtualBox (empiezan con 08:00:27)
    ip: "192.168.56.20"