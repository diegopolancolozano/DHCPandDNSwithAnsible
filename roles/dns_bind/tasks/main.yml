---
- name: Ensure BIND packages are installed
  ansible.builtin.package:
    name: "{{ bind_packages }}"
    state: present

- name: Configure named.conf
  ansible.builtin.template:
    src: named.conf.j2
    dest: "{{ bind_conf_file }}"
    owner: root
    group: named
    mode: '0640'
    validate: 'named-checkconf %s'
  notify: Restart BIND

- name: Deploy forward zone file
  ansible.builtin.template:
    src: zone.forward.j2
    dest: "{{ bind_zones_dir }}/{{ infra_domain }}.db"
    owner: root
    group: named
    mode: '0640'
    validate: "named-checkzone {{ infra_domain }} %s"
  notify: Reload BIND

- name: Deploy reverse zone file
  ansible.builtin.template:
    src: zone.reverse.j2
    dest: "{{ bind_zones_dir }}/{{ dns_reverse_zone }}.db"
    owner: root
    group: named
    mode: '0640'
    validate: "named-checkzone {{ dns_reverse_zone }} %s"
  notify: Reload BIND

- name: Ensure firewalld has DNS ports open
  ansible.builtin.firewalld:
    service: dns
    permanent: true
    state: enabled
    immediate: true
  ignore_errors: true # En caso de que firewalld no esté presente en el entorno de pruebas

- name: Ensure BIND is enabled and started
  ansible.builtin.service:
    name: "{{ bind_service }}"
    state: started
    enabled: true