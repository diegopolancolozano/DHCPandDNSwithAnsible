---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taller-nginx
  namespace: default
  labels:
    app: taller-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taller-nginx
  template:
    metadata:
      labels:
        app: taller-nginx
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-01
      containers:
        - name: nginx
          image: nginx:1.27.4-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: taller-nginx
  namespace: default
spec:
  type: NodePort
  selector:
    app: taller-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
